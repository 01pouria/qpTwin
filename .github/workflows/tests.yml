name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q src
      - name: Demo review gate
        run: |
          python scripts/demo_review.py > /tmp/qptwin-review.json
          python -c 'import json; r=json.load(open("/tmp/qptwin-review.json")); assert r["status"] == "BLOCKED_FOR_REVIEW"'
