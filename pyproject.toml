[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qptwin-mcp"
version = "0.4.0"
description = "Software engineering digital twin for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Pouriya Khalilian"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "digital-twin", "software-engineering", "architecture", "code-analysis", "ai-agents", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/01pouria/qpTwin"
Repository = "https://github.com/01pouria/qpTwin.git"
Issues = "https://github.com/01pouria/qpTwin/issues"
Documentation = "https://github.com/01pouria/qpTwin#readme"

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3.0"]
test = ["pytest>=8", "jsonschema>=4.23,<5"]

[project.scripts]
twindev-mcp = "twindev_mcp.server:main"
twindev-offline = "twindev_mcp.offline_stdio:main"
qptwin-mcp = "twindev_mcp.server:main"
qptwin-offline = "twindev_mcp.offline_stdio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
