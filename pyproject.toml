[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qptwin-mcp"
version = "0.4.0"
description = "qpTwin universal MCP: architecture-aware simulation and evidence tools for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Pouriya Khalilian"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3.0"]
test = ["pytest>=8", "jsonschema>=4.23,<5"]

[project.scripts]
twindev-mcp = "twindev_mcp.server:main"
twindev-offline = "twindev_mcp.offline_stdio:main"
qptwin-mcp = "twindev_mcp.server:main"
qptwin-offline = "twindev_mcp.offline_stdio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
